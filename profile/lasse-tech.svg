<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" role="img" aria-label="lasse tech">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3DBD"></stop>
      <stop offset="1" stop-color="#22E0FF"></stop>
    </linearGradient>
    <filter id="wmglow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" transform="translate(4,10) scale(0.8)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#7B37E6" stroke-width="5"></circle>
    <circle cx="50" cy="50" r="18" fill="#22E0FF"></circle>
    <circle cx="50" cy="8" r="8" fill="#FF3DBD"></circle>
    <circle cx="12" cy="72" r="8" fill="#A24BFF"></circle>
    <circle cx="88" cy="72" r="8" fill="#B4FF3D"></circle>
  </g>
  
  <text x="98" y="66" font-family="Wallpoet, monospace" font-size="40" letter-spacing="1.5" fill="url(#wm)" filter="url(#wmglow)">lasse tech</text>
</svg>